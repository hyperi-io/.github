# DO NOT EDIT. Published from hyperi-io/hyperi-licensing public/org-github/.github/ISSUE_TEMPLATE/bug.yml. Change it there: the next sync overwrites edits made here.
name: Bug report
description: Something that shipped does not work as documented.
type: Bug
body:
  - type: markdown
    attributes:
      value: Found a security problem? Do not file it here. Follow the security policy instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched open and closed issues and this is not a duplicate.
          required: true
        - label: I reproduced it on the version below.
          required: true
        - label: Logs and examples below contain no real hostnames, addresses, tokens or customer data.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit you ran.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and any error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows it.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: What you know
      description: Things you ran or read, with output or file and line.
  - type: textarea
    id: cause
    attributes:
      label: Suspected cause
      description: Step by step, input to wrong output. Say how confident you are and what would prove it wrong. Leave blank if you don't know.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime and any config that matters.
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      options:
        - None
        - AI helped write this issue
        - AI found or diagnosed the problem
    validations:
      required: true
  - type: input
    id: ai-detail
    attributes:
      label: AI tool and what you checked yourself
      description: For example, "Claude, I reran the repro and read the code it pointed at".
