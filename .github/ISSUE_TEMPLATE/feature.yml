# DO NOT EDIT. Published from hyperi-io/hyperi-licensing public/org-github/.github/ISSUE_TEMPLATE/feature.yml. Change it there: the next sync overwrites edits made here.
name: Feature request
description: Ask for something the project cannot do yet.
type: Feature
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The goal, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
